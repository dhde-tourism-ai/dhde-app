# Weekly public transport refresh (Mondays 01:10 UTC, 10:10 JST).
#
# Re-downloads the GTFS-JP timetables in transport/config.json, rebuilds
# public/data/transport.json and transport_map.json, refreshes the Google
# Trends file (kept as is if Google refuses the request), validates all three,
# commits them to main when they changed and triggers the Pages deploy. The
# daily data refresh then copies them to the serving bucket with the rest of
# public/data. No secrets. Walking areas are fetched by hand
# (transport/fetch_walk_areas.py), since they only change with the paths.
name: Transport data refresh

on:
  schedule:
    - cron: '10 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: transport-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: transport/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -r transport/requirements.txt
      - run: python -m pytest transport/tests -q
      - name: Build transport access
        run: python transport/build_transport.py --refresh
      - name: Google Trends (optional)
        run: python transport/collect_trends.py
      - run: node scripts/check_transport.mjs
      - name: Commit when changed
        id: commit
        run: |
          files="public/data/transport.json public/data/transport_map.json public/data/transport_trends.json"
          # generated_at changes every run; only commit when something else did
          if git diff -U0 -- $files | grep '^[-+][^-+]' | grep -qv '"generated_at"'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $files
            git commit -m "Transport data refresh $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No transport changes"
          fi
      - name: Deploy
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
      # Nobody has to remember to check: a failed run opens (or comments on) one issue.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Transport data refresh failed"
          n=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Failed again on $(date -u +%Y-%m-%d): $RUN_URL"
          else
            gh issue create --title "$title" --body "The weekly transport refresh failed on $(date -u +%Y-%m-%d): $RUN_URL. The dashboard keeps the last good files until it is fixed."
          fi
