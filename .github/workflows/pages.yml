# Build the app and publish dist/ to GitHub Pages on every push to main.
# Pages itself must be enabled in the repo settings (Source: GitHub Actions);
# this workflow does not change any settings.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # A malformed real_data.json fails the deploy here; the previous site stays up.
      - run: node scripts/check_data.mjs
      - run: node scripts/check_transport.mjs
      # Live data origin (CloudFront). Empty -> the app reads the bundled public/data snapshot.
      - run: npm run build
        env:
          VITE_DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}
      # Hash routing already works on static hosting; the 404 copy catches stray deep links.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
