# Daily real-data refresh (09:00 JST, after all sources publish).
#
# Runs dhde-preprocessing-model (public) in this repo's own Actions, builds
# public/data/real_data.json with scripts/build_real_data.py, validates it,
# commits it to main when it changed and triggers the Pages deploy. No secrets:
# sources that need keys (TomTom, Rakuten) report "not set" and the build goes on.
# The history those keys collected (Rakuten, JARTIC, TomTom, Google reviews) is
# read from the preprocessing repo's live-data branch, which needs no key.
name: Daily data refresh

on:
  schedule:
    # 00:23 UTC, not 00:00: GitHub delays scheduled runs most at the top of the
    # hour (the 00:00 schedule started about 3 hours late in late September).
    - cron: '23 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  id-token: write   # OIDC login to AWS for the publish steps (no stored keys)

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Paths
        run: |
          echo "DHDE_WORKSPACE_ROOT=$RUNNER_TEMP/ws" >> "$GITHUB_ENV"
          echo "PREPROC=$RUNNER_TEMP/ws/dhde-preprocessing-model" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"

      - name: Check out dhde-app
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check out dhde-preprocessing-model
        run: |
          mkdir -p "$DHDE_WORKSPACE_ROOT"
          git clone --depth 1 --branch main https://github.com/dhde-tourism-ai/dhde-preprocessing-model.git "$PREPROC"
          echo "PREPROC_SHA=$(git -C "$PREPROC" rev-parse --short HEAD)" >> "$GITHUB_ENV"

      # Saved history of the sources that can't be downloaded later (collected by
      # dhde-preprocessing-model's collector workflows). Not fatal: without it those
      # sources are left out, as before.
      - name: Check out live-data
        run: |
          if git clone --depth 1 --branch live-data https://github.com/dhde-tourism-ai/dhde-preprocessing-model.git "$RUNNER_TEMP/live"; then
            echo "DHDE_LIVE_DATA_ROOT=$RUNNER_TEMP/live" >> "$GITHUB_ENV"
          else
            echo "::warning::live-data branch not checked out; Rakuten, saved traffic and Google reviews are left out"
          fi

      # weather.py caches JMA hourly data at {workspace_root}/jma_cache/{node}_hourly.csv;
      # a cold run backfills about 12 minutes per node.
      - name: Restore JMA cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ws/jma_cache
          key: jma-${{ github.run_id }}
          restore-keys: jma-

      - name: Install pipeline requirements
        run: pip install -r "$PREPROC/requirements.txt" -r requirements-ci.txt

      - name: Fetch sources
        run: python "$PREPROC/scripts/fetch_data.py"

      - name: Build node tables
        run: |
          mkdir -p "$OUT"
          for n in tojinbo fukui_station katsuyama rainbow_line awara_onsen eiheiji; do
            python "$PREPROC/scripts/build_node.py" --node "$n" --output-dir "$OUT" || echo "::warning::build_node failed for $n"
          done
          count=$(ls "$OUT"/*_master.parquet 2>/dev/null | wc -l)
          echo "master files: $count"
          if [ "$count" -lt 4 ]; then
            echo "::error::only $count master files built (need at least 4)"
            exit 1
          fi

      # The 7-day forecast model (dhde-preprocessing-model scripts/build_forecast.py). Not fatal:
      # without forecast_fukui.csv, build_real_data.py leaves the forecast out and the
      # app falls back to its naive same-weekday forecast.
      - name: Build 7-day forecast
        continue-on-error: true
        run: |
          python "$PREPROC/scripts/build_integrated.py" --input-dir "$OUT" --output-dir "$OUT"
          python "$PREPROC/scripts/check_calibration.py" --input "$OUT/integrated_fukui_train.parquet" --output-dir "$OUT" \
            || echo "::warning::check_calibration failed; visitors fall back to the 2025 sum"
          python "$PREPROC/scripts/build_forecast.py" --input "$OUT/integrated_fukui_train.parquet" \
            --full "$OUT/integrated_fukui.parquet" --output-dir "$OUT"

      # continue-on-error hides a failed step behind a near-green run; say it in the summary.
      - name: Check the forecast came out
        run: |
          if [ ! -f "$OUT/forecast_fukui.csv" ]; then
            echo "::warning::7-day forecast not built (no forecast_fukui.csv); the app keeps its naive forecast today"
          fi

      - name: Build real_data.json
        run: python scripts/build_real_data.py --input "$OUT" --forecast "$OUT/forecast_fukui.csv" --calibration "$OUT/calibration_check.csv" --out public/data/real_data.json --source-commit "$PREPROC_SHA"

      - name: Validate real_data.json
        run: node scripts/check_data.mjs

      # Loop #3's occupancy thresholds per hotel area, from the same master tables.
      # Not fatal: without the file the app keeps the demo rule.
      - name: Build hotel thresholds
        continue-on-error: true
        run: python scripts/build_hotel_thresholds.py --input "$OUT" --out public/data/hotel_thresholds.json

      # The 12-month forecast (dhde-preprocessing-model scripts/forecast_monthly.py) for the
      # Strategy view's Q2. It downloads its own two sources (JTTA visitors, JTA guest-nights).
      # Not fatal: if it fails, yesterday's monthly_forecast.json stays.
      - name: Build monthly forecast
        continue-on-error: true
        run: |
          python "$PREPROC/scripts/forecast_monthly.py" --output-dir "$OUT"
          python scripts/build_monthly_forecast.py --input "$OUT" --out public/data/monthly_forecast.json --source-commit "$PREPROC_SHA"

      # Publish to AWS (Go-live item 5). Runs only after the data validated, and
      # only when the repository variables are set, so nothing changes until the
      # dhde-dev-app-publisher role exists. The role trusts this repo's main
      # branch only. Existing steps below are unchanged: the commit to main stays
      # as the fallback copy that Pages bundles.
      # Both AWS steps are continue-on-error: an AWS problem must never stop the
      # commit and Pages deploy below, which keep the site's bundled copy fresh.
      - name: Log in to AWS (OIDC)
        id: aws_login
        if: vars.AWS_PUBLISH_ROLE_ARN != ''
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: us-east-1

      - name: Publish to S3 and CloudFront
        if: vars.AWS_PUBLISH_ROLE_ARN != '' && steps.aws_login.outcome == 'success'
        continue-on-error: true
        env:
          DATA_BUCKET: ${{ vars.DATA_BUCKET }}
          SERVING_BUCKET: ${{ vars.SERVING_BUCKET }}
          CF_DISTRIBUTION_ID: ${{ vars.CF_DISTRIBUTION_ID }}
        run: |
          for v in DATA_BUCKET SERVING_BUCKET CF_DISTRIBUTION_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::Repository variable $v is empty; set it in Settings > Secrets and variables > Actions > Variables."
              exit 1
            fi
          done
          day=$(TZ=Asia/Tokyo date +%F)
          # History: the cleaned per-node tables and forecast inputs, one folder per day.
          aws s3 sync "$OUT" "s3://$DATA_BUCKET/curated/$day/" --only-show-errors \
            --exclude "*" --include "*.parquet" --include "*.csv" --include "*.json"
          # Live copy the app reads: every data file (real_data.json, monthly_forecast.json, ...).
          aws s3 sync public/data/ "s3://$SERVING_BUCKET/data/" --only-show-errors \
            --exclude "*.sample.json" --content-type application/json --cache-control "max-age=600"
          aws cloudfront create-invalidation --distribution-id "$CF_DISTRIBUTION_ID" --paths "/data/*" \
            --query 'Invalidation.Id' --output text

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- public/data/real_data.json public/data/hotel_thresholds.json public/data/monthly_forecast.json; then
            echo "No change in real_data.json, hotel_thresholds.json or monthly_forecast.json."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/real_data.json public/data/hotel_thresholds.json public/data/monthly_forecast.json
          git commit -m "data: daily real data $(TZ=Asia/Tokyo date +%F) (preprocessing $PREPROC_SHA)"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not trigger other workflows; a dispatch does.
      - name: Deploy the new data
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      # Failure alarm: email the team through the dhde-dev-refresh-alerts topic
      # (dhde-terraform-aws). Its own login, since the run may have failed before
      # the one above. A run that never starts, or fails and can't log in here,
      # is caught by the 13:00 JST check on the serving data's age instead.
      - name: Log in to AWS for the failure alert
        id: alert_login
        if: failure() && vars.AWS_PUBLISH_ROLE_ARN != ''
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: us-east-1

      - name: Email the team that the refresh failed
        if: failure() && steps.alert_login.outcome == 'success'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          acct=$(aws sts get-caller-identity --query Account --output text)
          day=$(TZ=Asia/Tokyo date +%F)
          aws sns publish --topic-arn "arn:aws:sns:us-east-1:$acct:dhde-dev-refresh-alerts" \
            --subject "DHDE: the morning data refresh failed ($day)" \
            --message "Today's Daily data refresh in dhde-app failed. The run, with the failed step: $RUN_URL

          Fix the cause and re-run it (Re-run jobs, or Actions > Daily data refresh > Run workflow). Until then the app shows the last data that was published." \
            --query MessageId --output text
