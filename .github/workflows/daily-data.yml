# Daily real-data refresh (09:00 JST, after all sources publish).
#
# Runs dhde-preprocessing-model (public) in this repo's own Actions, builds
# public/data/real_data.json with scripts/build_real_data.py, validates it,
# commits it to main when it changed and triggers the Pages deploy. No secrets:
# sources that need keys (TomTom, Rakuten) report "not set" and the build goes on.
name: Daily data refresh

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Paths
        run: |
          echo "DHDE_WORKSPACE_ROOT=$RUNNER_TEMP/ws" >> "$GITHUB_ENV"
          echo "PREPROC=$RUNNER_TEMP/ws/dhde-preprocessing-model" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"

      - name: Check out dhde-app
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check out dhde-preprocessing-model
        run: |
          mkdir -p "$DHDE_WORKSPACE_ROOT"
          git clone --depth 1 --branch main https://github.com/dhde-tourism-ai/dhde-preprocessing-model.git "$PREPROC"
          echo "PREPROC_SHA=$(git -C "$PREPROC" rev-parse --short HEAD)" >> "$GITHUB_ENV"

      # weather.py caches JMA hourly data at {workspace_root}/jma_cache/{node}_hourly.csv;
      # a cold run backfills about 12 minutes per node.
      - name: Restore JMA cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ws/jma_cache
          key: jma-${{ github.run_id }}
          restore-keys: jma-

      - name: Install pipeline requirements
        run: pip install -r "$PREPROC/requirements.txt" -r requirements-ci.txt

      - name: Fetch sources
        run: python "$PREPROC/scripts/fetch_data.py"

      - name: Build node tables
        run: |
          mkdir -p "$OUT"
          for n in tojinbo fukui_station katsuyama rainbow_line awara_onsen eiheiji; do
            python "$PREPROC/scripts/build_node.py" --node "$n" --output-dir "$OUT" || echo "::warning::build_node failed for $n"
          done
          count=$(ls "$OUT"/*_master.parquet 2>/dev/null | wc -l)
          echo "master files: $count"
          if [ "$count" -lt 4 ]; then
            echo "::error::only $count master files built (need at least 4)"
            exit 1
          fi

      # The 7-day forecast model (dhde-preprocessing-model scripts/build_forecast.py). Not fatal:
      # without forecast_fukui.csv, build_real_data.py leaves the forecast out and the
      # app falls back to its naive same-weekday forecast.
      - name: Build 7-day forecast
        continue-on-error: true
        run: |
          python "$PREPROC/scripts/build_integrated.py" --input-dir "$OUT" --output-dir "$OUT"
          python "$PREPROC/scripts/check_calibration.py" --input "$OUT/integrated_fukui_train.parquet" --output-dir "$OUT" \
            || echo "::warning::check_calibration failed; visitors fall back to the 2025 sum"
          python "$PREPROC/scripts/build_forecast.py" --input "$OUT/integrated_fukui_train.parquet" \
            --full "$OUT/integrated_fukui.parquet" --output-dir "$OUT"

      - name: Build real_data.json
        run: python scripts/build_real_data.py --input "$OUT" --forecast "$OUT/forecast_fukui.csv" --calibration "$OUT/calibration_check.csv" --out public/data/real_data.json --source-commit "$PREPROC_SHA"

      - name: Validate real_data.json
        run: node scripts/check_data.mjs

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- public/data/real_data.json; then
            echo "No change in real_data.json."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/real_data.json
          git commit -m "data: daily real data $(TZ=Asia/Tokyo date +%F) (preprocessing $PREPROC_SHA)"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not trigger other workflows; a dispatch does.
      - name: Deploy the new data
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
