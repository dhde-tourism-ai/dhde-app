<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1120" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Set the theme before first paint so the page doesn't flash dark (src/lib/theme.ts owns it after).
      try {
        var q = new URLSearchParams(location.search).get('theme')
        var s = localStorage.getItem('dhde.theme')
        document.documentElement.dataset.theme = q === 'light' || q === 'dark' ? q : s === 'dark' ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <meta name="description" content="DHDE · Fukui Tourism Intelligence: live visitor, flow, traffic, weather and sentiment layers for Fukui's priority sites, node forecasts and the five strategic questions." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>DHDE · Fukui Tourism Intelligence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
